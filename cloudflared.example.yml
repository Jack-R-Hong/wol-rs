# 範例: ~/.cloudflared/config.yml
# 1) cloudflared tunnel login
# 2) cloudflared tunnel create wol
# 3) 將 <tunnel-id> 填入
# 4) cloudflared tunnel route dns <tunnel-id> wol.example.com
# 5) cloudflared tunnel run wol

tunnel: <tunnel-id>
credentials-file: /home/pi/.cloudflared/<tunnel-id>.json

ingress:
  - hostname: wol.example.com
    service: http://127.0.0.1:8787
  - service: http_status:404
