[package]
name = "wolrs"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency Wake-on-LAN CLI + HTTP server (for RPi3 + Cloudflare Tunnel)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
